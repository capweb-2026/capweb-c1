<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cap Web — départ</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1 id="persona">ArtBot 🎨</h1>
  </header>
  <main>
    <p id="accueil">Bonjour, je suis ArtBot 🎨 ! Je peux vous aider à découvrir les musées et les œuvres d’art.</p>
    <ul id="suggestions" aria-label="Suggestions">
      <li>Quels sont les meilleurs musées à Paris ?</li>
      <li>Quels types d’œuvres peut-on voir au Louvre ?</li>
      <li>Peux-tu me conseiller un musée selon mes goûts ?</li>
    </ul>
    <p id="status" role="status"></p>
    <section aria-labelledby="titre-chat">
      <h2 id="titre-chat">Discussion</h2>
      <ul id="messages" aria-label="Messages" aria-live="polite"></ul>
      <form id="chat-form">
        <label for="message">Votre message</label>
        <textarea id="message" name="message" rows="3" required maxlength="280"></textarea>
        <button type="submit">Envoyer</button>
      </form>
      <button type="button" id="effacer">Effacer la conversation</button>
    </section>
  </main>
  <footer>
    <span id="version">Version en attente...</span>
  </footer>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
